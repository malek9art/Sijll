name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/019fcd2c-sijll

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
      VITE_NEON_DATA_API_URL: ${{ secrets.VITE_NEON_DATA_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Neon configuration
        shell: bash
        run: |
          if [ -z "${VITE_NEON_AUTH_URL:-}" ]; then
            echo "::error::Missing repository secret: VITE_NEON_AUTH_URL"
            exit 1
          fi

          if [ -z "${VITE_NEON_DATA_API_URL:-}" ]; then
            echo "::error::Missing repository secret: VITE_NEON_DATA_API_URL"
            exit 1
          fi

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Build production application
        run: npm run build

      - name: Add GitHub Pages fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: false
          user_name: "sajil-bot"
          user_email: "sajil@users.noreply.github.com"
